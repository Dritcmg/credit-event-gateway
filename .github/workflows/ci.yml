name: Python verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ephemeral-ci-only-password
          POSTGRES_DB: credit_gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d credit_gateway_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gateway:ephemeral-ci-only-password@127.0.0.1:5432/credit_gateway_test
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:ephemeral-ci-only-password@127.0.0.1:5432/credit_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python scripts/verify.py --postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-public-evidence
          path: evidence/results.json
          if-no-files-found: error
